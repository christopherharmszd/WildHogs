name: Publish Wild Hogs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
